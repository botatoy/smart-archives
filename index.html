<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧档案馆管理系统</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
</head>
<body>
<div class="app">

  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-seal">档</div>
        <div class="brand-name">智慧档案馆</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-item" data-route="dashboard" href="#dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        工作台
      </a>
      <a class="nav-item" data-route="intake" href="#intake">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        档案接收
        <span class="nav-badge" id="intake-badge">8</span>
      </a>
      <a class="nav-item" data-route="appraisal" href="#appraisal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        智能鉴定
      </a>
      <a class="nav-item" data-route="archives" href="#archives">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        档案管理
      </a>
      <a class="nav-item" data-route="search" href="#search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        检索利用
      </a>
    </nav>
  </aside>

  <!-- ============ 主内容 ============ -->
  <div class="main">
    <header class="topbar">
      <div>
        <div class="page-title" id="page-title">工作台</div>
        <div class="page-crumb" id="page-crumb">首页 / 工作台</div>
      </div>
      <div class="topbar-right">
        <div class="top-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="top-dot"></span>
        </div>
        <div class="user-chip">
          <div class="user-avatar">管</div>
          <div class="user-meta">
            <div class="user-name">档案管理员</div>
            <div class="user-role">鉴定岗</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <!-- 视图由 app.js 渲染 -->
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-intake"></section>
      <section class="view" id="view-appraisal"></section>
      <section class="view" id="view-archives"></section>
      <section class="view" id="view-search"></section>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
